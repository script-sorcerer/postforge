<!doctype html>
<!--
  Shorts house template (docs/templates/shorts-composition/). The Producer copies this folder to
  Attachments/video/<topic title>/ and fills it from the Video script's beat table:
  - one host per beat below, each mounting compositions/beat-<n>.html, back to back
    (beat n starts where beat n-1 ends; its data-duration is the beat's Seconds);
  - one caption group per beat in compositions/captions.html;
  - the root's data-duration and the captions host's data-duration are the sum of all Seconds.
  Footage is copied from Attachments/ into assets/footage/ (ignored by git: the source stays in Attachments/).
-->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000000;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="beat-1"
        data-composition-id="beat-1"
        data-composition-src="compositions/beat-1.html"
        data-start="0"
        data-duration="3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="3"
        data-track-index="2"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
